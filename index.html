<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <div class="contenedor">
    <div class="encabezado">
      <h1>NaturalVida</h1>
      <p>Conéctate para descubrir bienestar y salud natural.</p>
    </div>

    <div class="caja-login">
      <form>
        <input type="text" placeholder="Correo electrónico o número de teléfono" id="usuario" />
        <input type="password" placeholder="Contraseña" id="password" />
        <button type="button" onclick="login()">Ingresar</button>
        <hr />
        <button class="boton-crear-cuenta">Crear cuenta nueva</button>
        
      </form>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>

</html>
